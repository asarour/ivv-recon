[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivv-recon"
version = "0.1.0"
description = "Source-to-target reconciliation for ETL migrations (SQL Server / Azure SQL / Synapse / Snowflake)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ali Sarour", email = "asarour@gmail.com"}]
keywords = ["etl", "data-migration", "reconciliation", "ivv", "data-quality",
            "datastage", "snowflake", "sql-server", "azure"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.0"]
snowflake = ["snowflake-connector-python>=3.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
ivv-recon = "ivv_recon.cli:main"

[project.urls]
Homepage = "https://github.com/asarour/ivv-recon"
Issues = "https://github.com/asarour/ivv-recon/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
